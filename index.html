<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073447"><meta name="description" content="Registro de visitas técnicas SNF"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Visitas SNF</title><style>
:root{--navy:#073447;--cyan:#087f9b;--bg:#f1f5f9;--line:#dbe4ea;--ok:#059669}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172033}.app{max-width:1050px;margin:auto;padding:12px}.hero{background:linear-gradient(120deg,var(--navy),var(--cyan));color:white;padding:20px;border-radius:20px}.hero h1{margin:4px 0}.stats,.tabs,.grid2{display:grid;gap:10px}.stats{grid-template-columns:repeat(3,1fr);margin-top:18px}.stat{text-align:center;background:#ffffff18;padding:10px;border-radius:12px}.tabs{grid-template-columns:repeat(4,1fr);background:white;padding:5px;border-radius:16px;margin:14px 0;position:sticky;top:4px;z-index:3}.tabs button,.btn{border:0;border-radius:11px;padding:12px;font-weight:700;cursor:pointer}.tabs button.active,.btn.primary{background:var(--navy);color:white}.panel,.equipment{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}.grid2{grid-template-columns:1fr 1fr}.field{display:grid;gap:6px;margin-bottom:12px}.wide{grid-column:1/-1}label{font-size:14px;font-weight:700}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}textarea{min-height:95px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions{justify-content:flex-end}.equipment{padding:0;overflow:hidden}.eqhead{background:var(--navy);color:white;padding:14px;display:flex;justify-content:space-between}.erow{display:grid;grid-template-columns:minmax(150px,1fr) 100px 135px;background:var(--navy);color:white;border-top:1px solid #ffffff20;align-items:center}.erow span{padding:9px}.erow input{border-radius:0;text-align:right}.subtitle{background:var(--navy);color:white;text-align:center;font-weight:700;padding:9px;border-top:1px solid #ffffff30}.report{border:1px solid var(--line);padding:18px;border-radius:12px}.report table{border-collapse:collapse;width:100%;font-size:13px}.report td,.report th{border:1px solid var(--line);padding:7px}.report th{background:var(--navy);color:white}.hidden{display:none}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:white;padding:12px 18px;border-radius:30px;font-weight:bold;z-index:9}.muted{color:#64748b;font-size:13px}@media(max-width:700px){.grid2{grid-template-columns:1fr}.wide{grid-column:auto}.tabs button{font-size:11px;padding:10px 4px}.erow{grid-template-columns:minmax(135px,1fr) 72px 105px}.app{padding:8px}.hero{border-radius:15px}.report{overflow:auto}}
</style></head><body><main class="app"><header class="hero"><b>SNF WATER SCIENCE</b><h1>Visita técnica en terreno</h1><div>Registro operacional, informe y envío al cliente.</div><div class="stats"><div class="stat"><b id="equipmentCount">3</b><br>Equipos</div><div class="stat"><b id="dataCount">0</b><br>Datos</div><div class="stat"><b id="recCount">No</b><br>Recomendación</div></div></header><nav class="tabs" id="tabs"></nav><div id="pages"></div></main><script src="app.js"></script></body></html>
